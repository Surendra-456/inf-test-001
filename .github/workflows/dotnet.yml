name: .NET 8 Build & Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UrlShortener

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore UrlShortener.sln

      - name: Build solution
        run: dotnet build UrlShortener.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test UrlShortener.sln --configuration Release --no-build --verbosity normal

      - name: Publish application
        run: dotnet publish UrlShortener.sln --configuration Release --output ./publish

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urlshortener-build
          path: UrlShortener/publish
