<div class="page-container">

  <div class="login-card">

    <h1 class="title">
      Login
    </h1>

    <div class="form-group">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        class="form-control"
        [(ngModel)]="email"
        placeholder="Enter email">

    </div>

    <div class="form-group">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        placeholder="Enter password">

    </div>

    <button
      class="btn btn-primary submit-btn"
      (click)="login()">

      Login

    </button>


  </div>

</div>
