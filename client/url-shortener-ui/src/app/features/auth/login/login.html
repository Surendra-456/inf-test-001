<div class="container mt-5">

  <h2>Login</h2>

  <input
    type="email"
    class="form-control mb-2"
    [(ngModel)]="email"
    placeholder="Email">

  <input
    type="password"
    class="form-control mb-3"
    [(ngModel)]="password"
    placeholder="Password">

  <button
    class="btn btn-primary"
    (click)="login()">

    Login

  </button>

</div>
