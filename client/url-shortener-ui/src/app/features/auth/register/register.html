<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-body">

          <h2 class="mb-4 text-center">
            Register
          </h2>

          <div class="mb-3">
            <label class="form-label">
              Username
            </label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="username"
              placeholder="Enter username">
          </div>

          <div class="mb-3">
            <label class="form-label">
              Email
            </label>

            <input
              type="email"
              class="form-control"
              [(ngModel)]="email"
              placeholder="Enter email">
          </div>

          <div class="mb-3">
            <label class="form-label">
              Password
            </label>

            <input
              type="password"
              class="form-control"
              [(ngModel)]="password"
              placeholder="Enter password">
          </div>

          <div class="d-grid">
            <button
              class="btn btn-primary"
              (click)="register()">
              Register
            </button>
          </div>

          <div class="mt-3 text-center">
            <a routerLink="/login">
              Already have an account? Login
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
